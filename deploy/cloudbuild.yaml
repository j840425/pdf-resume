# Cloud Build configuration for PDF RAG System
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pdf-rag-system:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pdf-rag-system:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pdf-rag-system:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pdf-rag-system:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pdf-rag-system'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pdf-rag-system:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/pdf-rag-system:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/pdf-rag-system:latest'

# Build timeout
timeout: '1200s'

# Use a more powerful machine for building
options:
  machineType: 'N1_HIGHCPU_8'
