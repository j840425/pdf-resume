# Cloud Run service configuration
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pdf-rag-system
  labels:
    app: pdf-rag-system
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/cpu-throttling: 'false'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - image: gcr.io/PROJECT_ID/pdf-rag-system:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: production
            - name: GCP_PROJECT_ID
              value: PROJECT_ID
            - name: GCP_LOCATION
              value: us-central1
            - name: VERTEX_AI_MODEL
              value: gemini-1.5-pro
            - name: EMBEDDING_MODEL
              value: text-embedding-004
            - name: STORAGE_TYPE
              value: cloud
            - name: GCS_BUCKET_NAME
              value: PROJECT_ID-pdfs
            - name: MAX_PDF_PAGES
              value: '2000'
            - name: PORT
              value: '8080'
          resources:
            limits:
              memory: 4Gi
              cpu: '2'
